
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#08090b">
<title>RM Empresarial | Pix</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:22px 14px;background:#111214;color:#f8f8f8;font-family:Arial,sans-serif}
main{max-width:440px;margin:0 auto}
.card{background:linear-gradient(145deg,#161719,#050505);border:1px solid #aeb3ba;border-radius:24px;padding:24px 20px;text-align:center;box-shadow:0 10px 32px #0008}
.brand{font-size:48px;line-height:1;font-weight:900;letter-spacing:2px;background:linear-gradient(#fff,#9ea3aa);color:transparent;background-clip:text;-webkit-background-clip:text}
.brand-sub{font-size:14px;letter-spacing:7px;margin:8px 0 20px;color:#d8d8d8}
.rule{height:1px;background:linear-gradient(90deg,transparent,#c6c9cd,transparent);margin:0 0 22px}
h1{font-size:24px;margin:0 0 8px}
p{color:#d0d1d3;line-height:1.5}
.qr{display:block;width:min(260px,100%);height:auto;margin:18px auto;background:white;padding:8px;border-radius:8px}
button{width:100%;border:1px solid #c5c8cc;border-radius:12px;padding:14px 12px;margin-top:10px;font-size:16px;font-weight:750;cursor:pointer}
.primary{background:#f4f4f4;color:#101113}
.secondary{background:#25272a;color:#fff}
label{display:block;text-align:left;font-weight:700;margin:20px 0 8px}
textarea{width:100%;min-height:104px;padding:11px;border:1px solid #6e7277;border-radius:10px;background:#0c0d0f;color:#f8f8f8;font-size:12px;overflow-wrap:anywhere}
#status{min-height:20px;color:#d9d9d9;font-size:14px}
.note{font-size:12px;color:#b9bdc1}
</style>
</head>
<body>
<main>
<section class="card">
<div class="brand">RM</div>
<div class="brand-sub">EMPRESARIAL</div>

</section>
</main>

<script>
const pix = document.getElementById('pixcode').value.trim();

async function copyPix() {
  const status = document.getElementById('status');
  try {
    await navigator.clipboard.writeText(pix);
    status.textContent = 'Código Pix copiado!';
  } catch (e) {
    const field = document.getElementById('pixcode');
    field.focus();
    field.select();
    status.textContent = 'Selecione e copie o código Pix.';
  }
}

async function sharePage() {
  const status = document.getElementById('status');
  if (navigator.share) {
    try {
      await navigator.share({
        title: 'RM Empresarial | Pix',
        url: location.href
      });
    } catch (e) {}
  } else {
    try {
      await navigator.clipboard.writeText(location.href);
      status.textContent = 'Link copiado!';
    } catch (e) {
      status.textContent = 'Copie o endereço desta página no navegador.';
    }
  }
}
</script>
